<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline · School Attendance</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f5f7fa; color: #212529; padding: 24px; text-align: center;
    }
    .card {
      max-width: 420px; background: #fff; border-radius: 12px; padding: 32px 28px;
      box-shadow: 0 8px 30px rgba(26, 58, 92, 0.12);
    }
    .icon { font-size: 44px; line-height: 1; }
    h1 { font-size: 20px; margin: 14px 0 8px; color: #1a3a5c; }
    p { font-size: 14px; line-height: 1.55; color: #495057; margin: 8px 0; }
    ul { text-align: left; font-size: 13px; color: #495057; margin: 12px auto; padding-left: 20px; max-width: 320px; }
    button {
      margin-top: 12px; background: #1a3a5c; color: #fff; border: 0; border-radius: 8px;
      padding: 10px 22px; font-size: 14px; cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">📡</div>
    <h1>You are offline</h1>
    <p>The attendance system needs a live connection to the school server.</p>
    <ul>
      <li>Attendance can never be recorded offline — this protects everyone from false check-ins.</li>
      <li>Your QR scan and location are verified on the server in real time.</li>
      <li>Reconnect and try again; nothing was lost.</li>
    </ul>
    <button id="retry">Try again</button>
  </main>
  <script src="/js/offline.js" defer></script>
</body>
</html>
